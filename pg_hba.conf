# Custom PostgreSQL configuration for MeroDaktar
# This allows both trust and password authentication

# TYPE  DATABASE        USER            ADDRESS                 METHOD

# "local" is for Unix domain socket connections only
local   all             all                                     trust

# IPv4 local connections: allow both trust and password auth
host    all             all             127.0.0.1/32            md5
host    all             all             localhost               md5

# IPv6 local connections:
host    all             all             ::1/128                 md5

# Allow replication connections from localhost
local   replication     all                                     trust
host    replication     all             127.0.0.1/32            md5
host    replication     all             ::1/128                 md5

# Allow connections from any host with password authentication
host    all             all             0.0.0.0/0               md5
