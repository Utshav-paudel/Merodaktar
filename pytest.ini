[pytest]
# Pytest configuration file

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test* *Tests
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers
    --maxfail=5

# Coverage options (run with: pytest --cov=app --cov-report=html)
# --cov=app
# --cov-report=term-missing
# --cov-report=html
# --cov-report=xml

# Markers for organizing tests
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (may require database, redis, etc.)
    e2e: End-to-end tests (full application testing)
    slow: Tests that take a long time to run
    api: API endpoint tests
    database: Tests that require database
    redis: Tests that require Redis
    auth: Authentication and authorization tests
    appointment: Appointment-related tests
    chat: Chat and symptom assessment tests
    ehr: Electronic health record tests
    speech: Speech transcription tests
    medgemma: MedGemma AI tests

# Asyncio configuration
asyncio_mode = auto

# Coverage configuration
[coverage:run]
source = app
omit = 
    */tests/*
    */test_*.py
    */__pycache__/*
    */migrations/*
    */venv/*
    */env/*

[coverage:report]
precision = 2
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
